# This module set was borrowed from wayblue.
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - sddm
        - sddm-themes
        - weston
        - qt6-qt5compat
        - qt6-qtquickcontrols2
        - qt6-qtsvg

  - type: script
    scripts:
      - setsddmtheming.sh

  - type: systemd
    system:
      enabled:
        - sddm.service
